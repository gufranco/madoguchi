name=Madoguchi
version=1.0.0
author=Gustavo Franco
maintainer=Gustavo Franco <gufranco@users.noreply.github.com>
sentence=Heap-free HTTP server for the Uno R4 Minima that serves its web pages from the SD card and a JWT-secured REST API generated from OpenAPI.
paragraph=Strict HTTP/1.1 parsing with trusted hosts and RFC 9457 problem details. Routes, query and form parameters, header capture, body streaming with 100-continue, CORS, files from the SD card with gzip, ranges and validators, Basic auth, JSON bodies, JWT login, DHCP and mDNS, a JSON request log, and an OpenAPI code generator.
category=Communication
url=https://github.com/gufranco/madoguchi
architectures=renesas_uno
includes=Madoguchi.h
