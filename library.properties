name=Madoguchi
version=1.0.0
author=Gustavo Franco
maintainer=Gustavo Franco <gufranco@users.noreply.github.com>
sentence=Small, heap-free HTTP server for the Uno R3 and Uno R4 Minima, with a JWT-secured REST API on the R4.
paragraph=Strict HTTP/1.1 parsing with trusted hosts and RFC 9457 problem details. Routes, query and form parameters, header capture, body streaming with 100-continue, CORS, static files from SD or flash, Basic auth, templates, JSON bodies, JWT login and an OpenAPI code generator with Swagger UI. Runs on an ATmega328P next to Ethernet and SD.
