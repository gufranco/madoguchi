<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Madoguchi RestPatch</title>
    <link rel="stylesheet" href="%PICO_CSS_HREF%" integrity="%PICO_CSS_INTEGRITY%" crossorigin="anonymous">
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><strong>Madoguchi</strong></li>
        </ul>
        <ul>
          <li><a href="/docs/">API docs</a></li>
          <li><button type="button" data-theme-toggle>Switch theme</button></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Change part of an item with PATCH</h1>
      <section aria-labelledby="patch-title">
        <h2 id="patch-title">Change only what you fill in</h2>
        <form>
          <label for="item-id">Item id</label>
          <input id="item-id" name="id" type="number" min="1" max="4" value="1" required>
          <label for="item-name">New name, or leave empty to keep it</label>
          <input id="item-name" name="name" type="text" maxlength="16">
          <label for="item-state">Switch</label>
          <select id="item-state" name="state">
            <option value="keep">Keep it as it is</option>
            <option value="on">On</option>
            <option value="off">Off</option>
          </select>
          <button type="submit">Change the item</button>
        </form>
        <p id="result" aria-live="polite"></p>
      </section>
    </main>
    <footer>
      <p role="status" aria-live="polite"></p>
    </footer>
  </body>
</html>
