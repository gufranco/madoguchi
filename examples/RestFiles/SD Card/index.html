<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Madoguchi RestFiles</title>
    <link rel="stylesheet" href="%PICO_CSS_HREF%" integrity="%PICO_CSS_INTEGRITY%" crossorigin="anonymous">
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><strong>Madoguchi</strong></li>
        </ul>
        <ul>
          <li><a href="/docs/">API docs</a></li>
          <li><button type="button" data-theme-toggle>Switch theme</button></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Files on the SD card</h1>
      <section aria-labelledby="files-title">
        <h2 id="files-title">Files</h2>
        <ul id="files"></ul>
      </section>
      <section aria-labelledby="upload-title">
        <h2 id="upload-title">Upload</h2>
        <form id="upload">
          <label for="file">File, named with up to 64 ASCII characters</label>
          <input id="file" name="file" type="file">
          <progress id="progress" max="1" value="0" aria-label="Upload progress"></progress>
          <button type="submit">Upload</button>
        </form>
      </section>
    </main>
    <footer>
      <p role="status" aria-live="polite"></p>
    </footer>
  </body>
</html>
