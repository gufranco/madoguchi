<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Madoguchi RestDelete</title>
    <link rel="stylesheet" href="%PICO_CSS_HREF%" integrity="%PICO_CSS_INTEGRITY%" crossorigin="anonymous">
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><strong>Madoguchi</strong></li>
        </ul>
        <ul>
          <li><a href="/docs/">API docs</a></li>
          <li><button type="button" data-theme-toggle>Switch theme</button></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Delete an item with DELETE</h1>
      <section aria-labelledby="delete-title">
        <h2 id="delete-title">Remove one item</h2>
        <form>
          <label for="item-id">Item id</label>
          <input id="item-id" name="id" type="number" min="1" max="4" value="1" required>
          <button type="submit">Delete the item</button>
        </form>
      </section>
    </main>
    <footer>
      <p role="status" aria-live="polite"></p>
    </footer>
  </body>
</html>
